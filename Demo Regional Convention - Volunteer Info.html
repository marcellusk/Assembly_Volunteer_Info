<title>Demo Regional Convention — Volunteer Reference</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}

  .daytabs{display:flex;max-width:640px;margin:0 auto;padding:0 16px}

  .swiper::-webkit-scrollbar{display:none}

  .prow .r{color:oklch(0.5 0.01 260);text-align:right}

  .srow a{font-size:13px;white-space:nowrap}

  .imgcard{cursor:zoom-in;border:1px solid oklch(0.9 0.005 260);border-radius:10px;overflow:hidden;background:#fff}

  .imgcard .cap{padding:8px 10px;font-size:12px;font-weight:600;color:oklch(0.35 0.01 260)}

  .imgsolo img{width:100%;display:block}
  .imgsolo .cap{padding:8px 10px;font-size:12px;font-weight:600;color:oklch(0.35 0.01 260)}
  .dirbtn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:oklch(0.94 0.01 260);border:none;border-radius:10px;font-size:14px;font-weight:700;color:oklch(0.25 0.02 260);cursor:pointer;font-family:inherit}
  .dirsearch{width:100%;padding:10px 12px;border:1px solid oklch(0.85 0.005 260);border-radius:8px;font-size:14px;margin:10px 0;font-family:inherit}
  .dirlist{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto}
  .dcard{border:1px solid oklch(0.92 0.005 260);border-radius:8px;padding:10px 12px}
  .dcard .top{display:flex;justify-content:space-between;gap:8px}
  .dcard .top b{font-size:14px}
  .dcard .top a{font-size:13px;white-space:nowrap}
  .dcard .asg{font-size:13px;color:oklch(0.5 0.01 260);margin-top:2px}
  .dcard .con{font-size:12px;color:oklch(0.55 0.05 45);margin-top:4px;font-style:italic}
  footer.note{font-size:12px;color:oklch(0.5 0.01 260);line-height:1.6;border-top:1px solid oklch(0.9 0.005 260);padding-top:14px}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
  .lightbox img{max-width:100%;max-height:100%;border-radius:6px}
  .empty{font-size:13px;color:oklch(0.6 0.01 260);font-style:italic}

<header id="hdr"></header>
<div class="swiper" id="swiper"></div>
<div id="lightbox"></div>
<script>
(function(){
  var project = JSON.parse(document.getElementById('project-data').textContent);
  var ev = project.event, groups = project.groups, days = ev.days;
  var curDay = days.length ? days[0].id : null;
  var curGroup = 0;

  function toTel(p){ return 'tel:+1' + String(p||'').replace(/\D/g,''); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function hueColor(h,l,c){ return 'oklch(' + (l||0.7) + ' ' + (c||0.16) + ' ' + h + ')'; }

  var hdr = document.getElementById('hdr');
  var swiper = document.getElementById('swiper');
  var lightbox = document.getElementById('lightbox');

  function renderHeader(){
    var h = '<div class="hwrap"><div class="evtitle">' + esc(ev.title) + '</div><div class="evsub">' + esc(ev.subtitle) + '</div></div>';
    if (groups.length > 1) {
      h += '<div class="pills" id="pills">';
      groups.forEach(function(g,i){
        var st = i===curGroup ? 'background:' + hueColor(g.hue,0.55,0.15) + ';' : '';
        h += '<button class="pill' + (i===curGroup?' active':'') + '" style="' + st + '" data-g="' + i + '">' + esc(g.name) + '</button>';
      });
      h += '</div>';
    }
    if (days.length > 1) {
      h += '<div class="daytabs">';
      days.forEach(function(d){
        var ac = d.id===curDay;
        var st = ac ? 'border-bottom-color:' + hueColor(groups[curGroup]?groups[curGroup].hue:45,0.7,0.16) : '';
        h += '<button class="dtab' + (ac?' active':'') + '" style="' + st + '" data-d="' + d.id + '">' + esc(d.label) + '</button>';
      });
      h += '</div>';
    } else { h += '<div style="height:8px"></div>'; }
    hdr.innerHTML = h;
    hdr.querySelectorAll('.pill').forEach(function(b){
      b.onclick = function(){ scrollToGroup(+b.dataset.g); };
    });
    hdr.querySelectorAll('.dtab').forEach(function(b){
      b.onclick = function(){ curDay = b.dataset.d; renderHeader(); renderPanels(); };
    });
    var ap = hdr.querySelector('.pill.active');
    if (ap && ap.scrollIntoView) ap.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
  }

  var uiState = {};  // per-group: {dirOpen, search}
  function gs(gi){ return uiState[gi] || (uiState[gi] = {dirOpen:false, search:''}); }

  function renderSection(sec, gi){
    var out = '';
    if (sec.type === 'contacts') {
      out += '<div class="contactsbox"><div class="sechead">' + esc(sec.title) + '</div>';
      if (!sec.items.length) out += '<div class="empty">No contacts listed.</div>';
      sec.items.forEach(function(p){
        out += '<div class="crow"><div class="top"><strong>' + esc(p.name) + '</strong>' +
          (p.phone ? '<a href="' + toTel(p.phone) + '" style="font-weight:600">' + esc(p.phone) + '</a>' : '') +
          '</div><div class="role">' + esc(p.role) + '</div></div>';
      });
      out += '</div>';
    }
    else if (sec.type === 'roster') {
      var lots = (sec.perDay && sec.perDay[curDay]) || [];
      out += '<div><div class="sechead">' + esc(sec.title) + '</div>';
      if (!lots.length) out += '<div class="empty">No assignments for this day.</div>';
      lots.forEach(function(lot){
        out += '<div class="lot"><div class="lot-head">' + esc(lot.name) + '</div><div class="lot-body">';
        lot.people.forEach(function(pp){
          out += '<div class="prow"><span>' + esc(pp.name) + '</span><span class="r">' + esc(pp.role) + '</span></div>';
        });
        out += '</div></div>';
      });
      out += '</div>';
    }
    else if (sec.type === 'schedule') {
      var rows = (sec.perDay && sec.perDay[curDay]) || [];
      out += '<div><div class="sechead">' + esc(sec.title) + '</div><div class="schedbox">';
      if (!rows.length) out += '<div class="srow"><span class="empty">Nothing scheduled for this day.</span></div>';
      rows.forEach(function(r){
        out += '<div class="srow"><span class="t">' + esc(r.time) + '</span><span class="n">' + esc(r.name) + '</span>' +
          (r.phone ? '<a href="' + toTel(r.phone) + '">' + esc(r.phone) + '</a>' : '') + '</div>';
      });
      out += '</div></div>';
    }
    else if (sec.type === 'notes') {
      var txt = sec.byDay ? ((sec.perDayText && sec.perDayText[curDay]) || '') : (sec.text || '');
      if (txt.trim()) {
        out += '<div><div class="sechead">' + esc(sec.title) + '</div><div class="notesbox">' + esc(txt) + '</div></div>';
      }
    }
    else if (sec.type === 'images') {
      var items = (sec.items || []).filter(function(im){ return im && im.src; });
      if (items.length) {
        out += '<div><div class="sechead">' + esc(sec.title) + '</div>';
        if (items.length === 1) {
          out += '<div class="imgsolo" data-lb="' + gi + ':' + 0 + ':' + sec.id + '"><img src="' + items[0].src + '" alt="' + esc(items[0].caption) + '">' +
            (items[0].caption ? '<div class="cap">' + esc(items[0].caption) + '</div>' : '') + '</div>' +
            '<div style="font-size:12px;color:oklch(0.55 0.01 260);margin-top:6px">Tap image to enlarge.</div>';
        } else {
          out += '<div class="imggrid">';
          items.forEach(function(im, ii){
            out += '<div class="imgcard" data-lb="' + gi + ':' + ii + ':' + sec.id + '"><img src="' + im.src + '" alt="' + esc(im.caption) + '">' +
              (im.caption ? '<div class="cap">' + esc(im.caption) + '</div>' : '') + '</div>';
          });
          out += '</div><div style="font-size:12px;color:oklch(0.55 0.01 260);margin-top:6px">Tap any image to enlarge.</div>';
        }
        out += '</div>';
      }
    }
    else if (sec.type === 'directory') {
      var st = gs(gi);
      var q = (st.search || '').trim().toLowerCase();
      var list = (sec.items || []).filter(function(v){
        return !q || (v.name||'').toLowerCase().indexOf(q) >= 0 || (v.assignment||'').toLowerCase().indexOf(q) >= 0;
      }).slice().sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
      out += '<div><button class="dirbtn" data-dir="' + sec.id + '"><span>' + esc(sec.title) + ' (' + (sec.items||[]).length + ')</span><span>' + (st.dirOpen ? '&#8722;' : '+') + '</span></button>';
      if (st.dirOpen) {
        out += '<input class="dirsearch" data-dirsearch="' + sec.id + '" placeholder="Search name or assignment…" value="' + esc(st.search) + '">';
        out += '<div class="dirlist">';
        list.forEach(function(v){
          out += '<div class="dcard"><div class="top"><b>' + esc(v.name) + '</b>' +
            (v.phone ? '<a href="' + toTel(v.phone) + '">' + esc(v.phone) + '</a>' : '') + '</div>' +
            (v.assignment ? '<div class="asg">' + esc(v.assignment) + '</div>' : '') +
            (v.constraints ? '<div class="con">' + esc(v.constraints) + '</div>' : '') + '</div>';
        });
        if (!list.length) out += '<div class="empty">No matches.</div>';
        out += '</div>';
      }
      out += '</div>';
    }
    return out;
  }

  function renderPanels(){
    var scrollPositions = [];
    swiper.querySelectorAll('.panel').forEach(function(p){ scrollPositions.push(p.scrollTop); });
    var keepX = swiper.scrollLeft;
    var h = '';
    groups.forEach(function(g, gi){
      h += '<div class="panel"><div class="pinner">';
      g.sections.forEach(function(sec){ h += renderSection(sec, gi); });
      if (ev.footer && ev.footer.trim()) h += '<footer class="note">' + esc(ev.footer).replace(/\n/g,'<br>') + '</footer>';
      h += '</div></div>';
    });
    swiper.innerHTML = h;
    var panels = swiper.querySelectorAll('.panel');
    panels.forEach(function(p,i){ if (scrollPositions[i] != null) p.scrollTop = scrollPositions[i]; });
    swiper.scrollLeft = keepX;
    swiper.querySelectorAll('[data-lb]').forEach(function(elm){
      elm.onclick = function(){
        var parts = elm.dataset.lb.split(':');
        var g = groups[+parts[0]];
        var sec = null;
        g.sections.forEach(function(s){ if (s.id === parts[2]) sec = s; });
        if (!sec) return;
        var im = sec.items.filter(function(x){ return x && x.src; })[+parts[1]];
        if (!im) return;
        lightbox.innerHTML = '<div class="lightbox"><img src="' + im.src + '"></div>';
        lightbox.firstChild.onclick = function(){ lightbox.innerHTML = ''; };
      };
    });
    swiper.querySelectorAll('[data-dir]').forEach(function(b){
      b.onclick = function(){
        var gi = +b.closest('.panel').dataset.gi;
        var st = gs(gi); st.dirOpen = !st.dirOpen;
        renderPanels();
      };
    });
    panels.forEach(function(p,i){ p.dataset.gi = i; });
    swiper.querySelectorAll('[data-dirsearch]').forEach(function(inp){
      inp.oninput = function(){
        var gi = +inp.closest('.panel').dataset.gi;
        gs(gi).search = inp.value;
        var keep = inp.selectionStart;
        renderPanels();
        var again = swiper.querySelector('.panel[data-gi="' + gi + '"] [data-dirsearch]');
        if (again){ again.focus(); again.setSelectionRange(keep, keep); }
      };
    });
  }

  function scrollToGroup(i){
    swiper.scrollTo({left: i * swiper.clientWidth, behavior:'smooth'});
  }

  var scrollTimer = null;
  swiper.addEventListener('scroll', function(){
    if (scrollTimer) clearTimeout(scrollTimer);
    scrollTimer = setTimeout(function(){
      var i = Math.round(swiper.scrollLeft / Math.max(1, swiper.clientWidth));
      i = Math.max(0, Math.min(groups.length - 1, i));
      if (i !== curGroup){ curGroup = i; renderHeader(); }
    }, 80);
  });

  renderHeader();
  renderPanels();
})();
</script>
